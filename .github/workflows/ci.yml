name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate grammar JSON
        run: |
          node -e "
            JSON.parse(require('fs').readFileSync('syntaxes/coffeeql.tmLanguage.json','utf8'));
            console.log('✅ grammar valid');
          "

      - name: Validate snippets JSON
        run: |
          node -e "
            JSON.parse(require('fs').readFileSync('snippets/coffeeql.json','utf8'));
            console.log('✅ snippets valid');
          "

      - name: Validate language configuration JSON
        run: |
          node -e "
            JSON.parse(require('fs').readFileSync('language-configuration.json','utf8'));
            console.log('✅ language config valid');
          "

      - name: Check all required files exist
        run: |
          files=(
            "syntaxes/coffeeql.tmLanguage.json"
            "snippets/coffeeql.json"
            "language-configuration.json"
            "README.md"
            "CONTRIBUTING.md"
            "LICENSE"
          )
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing required file: $f"
              exit 1
            else
              echo "✅ Found: $f"
            fi
          done

      - name: Check grammar has required token patterns
        run: |
          node -e "
            const g = JSON.parse(require('fs').readFileSync('syntaxes/coffeeql.tmLanguage.json','utf8'));
            const names = g.repository ? Object.keys(g.repository) : [];
            const required = ['keywords','strings','numbers','booleans','comments','operators','collection-structured','collection-unstructured'];
            const missing = required.filter(r => !names.includes(r));
            if (missing.length > 0) {
              console.error('❌ Missing grammar patterns:', missing.join(', '));
              process.exit(1);
            }
            console.log('✅ All required grammar patterns present:', required.join(', '));
          "

      - name: Check snippets have required prefixes
        run: |
          node -e "
            const s = JSON.parse(require('fs').readFileSync('snippets/coffeeql.json','utf8'));
            const prefixes = Object.values(s).map(v => v.prefix);
            const required = ['query','pour','refill','spill','mix','blend','grind','shot'];
            const missing = required.filter(r => !prefixes.includes(r));
            if (missing.length > 0) {
              console.error('❌ Missing snippet prefixes:', missing.join(', '));
              process.exit(1);
            }
            console.log('✅ All required snippet prefixes present');
          "

      - name: Check no duplicate snippet prefixes
        run: |
          node -e "
            const s = JSON.parse(require('fs').readFileSync('snippets/coffeeql.json','utf8'));
            const prefixes = Object.values(s).map(v => v.prefix);
            const dupes = prefixes.filter((p, i) => prefixes.indexOf(p) !== i);
            if (dupes.length > 0) {
              console.error('❌ Duplicate snippet prefixes:', dupes.join(', '));
              process.exit(1);
            }
            console.log('✅ No duplicate snippet prefixes');
          "
